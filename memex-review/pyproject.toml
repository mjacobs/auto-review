[project]
name = "memex-review"
version = "0.1.0"
description = "Daily narrative recaps of cf-memex captures, written into the Obsidian vault."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "mj", email = "m@m4tt.xyz" }]
dependencies = [
  "click>=8.1",
  "httpx>=0.27",
  "python-frontmatter>=1.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-dateutil>=2.9",
]

[project.scripts]
memex-review = "memex_review.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memex_review"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
