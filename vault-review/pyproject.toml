[project]
name = "vault-review"
version = "0.1.0"
description = "Daily and weekly narrative recaps of vault activity, derived from git diff."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "mj" }]
dependencies = [
  "click>=8.1",
  "psycopg[binary]>=3.2",
  "python-frontmatter>=1.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-dateutil>=2.9",
]

[project.scripts]
vault-review = "vault_review.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_review"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
