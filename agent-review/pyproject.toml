[project]
name = "agent-review"
version = "0.1.0"
description = "Daily narrative reports of agent (Claude/Codex/Gemini/...) activity, written into the Obsidian vault."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "mj" }]
dependencies = [
  "anthropic>=0.40.0",
  "psycopg[binary]>=3.2",
  "click>=8.1",
  "jinja2>=3.1",
  "python-frontmatter>=1.1",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "tenacity>=9.0",
  "python-dateutil>=2.9",
]

[project.scripts]
agent-review = "agent_review.cli:main"

[dependency-groups]
dev = [
  "google-genai>=2.6.0",
  "openai>=2.38.0",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_review"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
